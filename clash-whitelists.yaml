mode: rule
log-level: warning
ipv6: false
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
    TLS:
      ports:
      - 443
  skip-domain:
  - "+.lan"
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  mtu: 9000
dns:
  enable: true
  listen: 0.0.0.0:1183
  ipv6: false
  default-nameserver:
  - system://dhcp
  nameserver:
  - https://1.1.1.1/dns-query#PROXY
  - https://8.8.8.8/dns-query#PROXY
proxy-providers:
  WHITELISTS:
    type: http
    url: https://gitverse.ru/zieng2/wl/content/master/list_universal.txt
    interval: 300
    proxy: DIRECT
proxy-groups:
  - name: PROXY
    type: select
    use:
      - WHITELISTS
rules:
- MATCH,PROXY
