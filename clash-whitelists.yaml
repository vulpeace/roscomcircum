---
mode: rule
log-level: warning
ipv6: false
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
    TLS:
      ports:
      - 443
  skip-domain:
  - "+.lan"
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  mtu: 9000
dns:
  enable: true
  listen: 0.0.0.0:1183
  ipv6: false
  default-nameserver:
  - dhcp://system
  nameserver:
  - https://1.1.1.1/dns-query#PROXY
  - https://8.8.8.8/dns-query#PROXY
proxy-providers:
  WHITELISTS:
    type: http
    url: "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt"
    interval: 3600
    proxy: DIRECT
    header:
      User-Agent:
      - "Clash"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
proxy-groups:
  - name: PROXY
    type: select
    use:
      - WHITELISTS
rule-providers:
  geosite-private:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/private.mrs
    interval: 86400
    proxy: PROXY
  geoip-private:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geoip/private.mrs
    interval: 86400
    proxy: PROXY
  geosite-cheburnet:
    type: http
    behavior: domain
    format: yaml
    url: 
    interval: 86400
    proxy: PROXY
rules:
- AND,((NETWORK,udp),(DST-PORT,443)),REJECT
- RULE-SET,geosite-private,DIRECT
- RULE-SET,geoip-private,DIRECT
- RULE-SET,geosite-cheburnet,DIRECT
- MATCH,PROXY
